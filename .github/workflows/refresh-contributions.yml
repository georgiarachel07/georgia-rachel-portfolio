name: Refresh public contribution calendar
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/refresh-contributions.py
      - .github/workflows/refresh-contributions.yml
permissions:
  contents: write
concurrency:
  group: public-contribution-calendar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the anonymous GitHub calendar
        run: python scripts/refresh-contributions.py
      - name: Save the refreshed calendar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-history.json
          git diff --cached --quiet || git commit -m "Refresh public GitHub contribution calendar"
          git push

